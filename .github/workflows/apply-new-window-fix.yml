name: Apply NEW opportunity 24-hour window fix

on:
  push:
    paths:
      - ".github/workflows/apply-new-window-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch scraper NEW-opportunity retention
        shell: python
        run: |
          from pathlib import Path

          path = Path("scraper/scraper.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'from datetime import datetime\n',
                  'from datetime import datetime, timedelta\n',
              ),
              (
                  'MAX_ARCHIVED_OPPORTUNITIES = 30\n',
                  'MAX_ARCHIVED_OPPORTUNITIES = 30\n\n# NEW opportunities remain highlighted for 24 hours after first discovery.\nNEW_OPPORTUNITY_DISPLAY_WINDOW = 24 * 60 * 60\n',
              ),
              (
                  '        "updated_at": None,\n    }\n',
                  '        "updated_at": None,\n        "new_opportunity_first_seen_at": {},\n    }\n',
              ),
              (
                  '        data.setdefault(\n            "updated_at",\n            None,\n        )\n\n        for entry in data["processed"].values():\n',
                  '        data.setdefault(\n            "updated_at",\n            None,\n        )\n\n        data.setdefault(\n            "new_opportunity_first_seen_at",\n            {},\n        )\n\n        for entry in data["processed"].values():\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"PATCH TARGET NOT FOUND: {old[:80]!r}")
              text = text.replace(old, new, 1)

          marker = '''def get_current_results(\n    checkpoint,\n    current_ids,\n):\n'''
          helper = '''def get_active_new_opportunity_ids(checkpoint, current_ids):\n    """Return newly discovered IDs that are still within the 24-hour window."""\n    first_seen = checkpoint.get("new_opportunity_first_seen_at", {})\n    now = datetime.now()\n    active = []\n    stale = []\n\n    for raw_id, raw_timestamp in first_seen.items():\n        opid = str(raw_id)\n        if opid not in current_ids:\n            stale.append(opid)\n            continue\n\n        seen_at = parse_iso_datetime(raw_timestamp)\n        if seen_at is None:\n            stale.append(opid)\n            continue\n\n        if (now - seen_at.replace(tzinfo=None)).total_seconds() <= NEW_OPPORTUNITY_DISPLAY_WINDOW:\n            active.append(opid)\n        else:\n            stale.append(opid)\n\n    for opid in stale:\n        first_seen.pop(opid, None)\n\n    return sorted(set(active))\n\n\ndef get_current_results(\n    checkpoint,\n    current_ids,\n):\n'''
          if marker not in text:
              raise SystemExit("PATCH TARGET NOT FOUND: get_current_results marker")
          text = text.replace(marker, helper, 1)

          old = '''        save_public_output(\n            opportunities,\n            checkpoint,\n            current_ids,\n            generated_at=cycle_generated_at,\n            new_opportunity_ids=newly_scanned_ids,\n        )\n'''
          new = '''        active_new_ids = get_active_new_opportunity_ids(\n            checkpoint,\n            current_ids,\n        )\n\n        save_public_output(\n            opportunities,\n            checkpoint,\n            current_ids,\n            generated_at=cycle_generated_at,\n            new_opportunity_ids=active_new_ids,\n        )\n'''
          if old not in text:
              raise SystemExit("PATCH TARGET NOT FOUND: no-batch public output")
          text = text.replace(old, new, 1)

          old = '''                    if previous_entry is None:\n                        newly_scanned_ids.add(\n                            str(opid)\n                        )\n'''
          new = '''                    if previous_entry is None:\n                        new_id = str(opid)\n                        newly_scanned_ids.add(new_id)\n                        checkpoint.setdefault(\n                            "new_opportunity_first_seen_at",\n                            {},\n                        )[new_id] = checked_at\n'''
          if old not in text:
              raise SystemExit("PATCH TARGET NOT FOUND: new-ID detection")
          text = text.replace(old, new, 1)

          old = '''    output = save_public_output(\n        opportunities,\n        checkpoint,\n        current_ids,\n        generated_at=cycle_generated_at,\n        new_opportunity_ids=newly_scanned_ids,\n    )\n'''
          new = '''    active_new_ids = get_active_new_opportunity_ids(\n        checkpoint,\n        current_ids,\n    )\n\n    output = save_public_output(\n        opportunities,\n        checkpoint,\n        current_ids,\n        generated_at=cycle_generated_at,\n        new_opportunity_ids=active_new_ids,\n    )\n'''
          if old not in text:
              raise SystemExit("PATCH TARGET NOT FOUND: batched public output")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("PASS: scraper patched for 24-hour NEW opportunity retention.")

      - name: Validate scraper
        run: |
          python -m py_compile scraper/scraper.py
          grep -F 'NEW_OPPORTUNITY_DISPLAY_WINDOW = 24 * 60 * 60' scraper/scraper.py
          grep -F 'new_opportunity_first_seen_at' scraper/scraper.py
          echo 'PASS: 24-hour NEW retention patch validated.'

      - name: Commit and push scraper fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper/scraper.py
          git commit -m 'fix: retain NEW opportunities for 24 hours'
          git push origin main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-new-window-fix.yml
          git commit -m 'chore: remove temporary NEW retention fixer'
          git push origin main
