name: ESC Opportunity Update Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: esc-opportunity-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Check scraper heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Evaluate scraper heartbeat
        id: heartbeat
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/heartbeat.txt
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/last_successful_run.json")
          stale = True
          age_minutes = None

          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  raw = payload.get("last_successful_run_at")
                  if raw:
                      timestamp = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                      age_minutes = (datetime.now(timezone.utc) - timestamp).total_seconds() / 60
                      stale = age_minutes > 60
                      print(f"Last successful scraper run: {raw}")
                      print(f"Heartbeat age: {age_minutes:.1f} minutes")
              except Exception as exc:
                  print(f"WARN: heartbeat could not be parsed: {exc}")
          else:
              print("WARN: heartbeat file is missing.")

          print(f"stale={'true' if stale else 'false'}")
          PY

          stale_value="$(sed -n 's/^stale=//p' /tmp/heartbeat.txt | tail -n 1)"
          echo "stale=${stale_value:-true}" >> "$GITHUB_OUTPUT"

      - name: Check for active or queued scraper run
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active_runs="$(gh run list --workflow update.yml --status in_progress --status queued --limit 20 --json status --jq 'length')"
          echo "active_or_queued_runs=${active_runs}"
          if [ "$active_runs" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PASS: scraper already has an active or queued run; no duplicate recovery."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No active or queued scraper run found."
          fi

      - name: Dispatch scraper recovery
        if: steps.heartbeat.outputs.stale == 'true' && steps.active.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "WARN: scraper heartbeat is stale and no active run exists."
          echo "Dispatching an automatic recovery run..."
          gh workflow run update.yml --ref main -f recovery=true
          echo "PASS: stale-scraper recovery dispatch accepted."
