name: Fix deterministic city localization

on:
  push:
    paths:
      - ".github/workflows/fix-city-localization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-city-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update app.js rendering boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("web/app.js")
          text = path.read_text(encoding="utf-8")

          import_block = 'import { localizeNewCity } from "./city-localizations.js";\n\n'
          marker = 'import {\n  filterRows,\n  sortRows,\n  renderRows,\n} from "./table.js";\n\n'
          if import_block not in text:
              if marker not in text:
                  raise SystemExit("ERROR: app.js table import marker not found")
              text = text.replace(marker, marker + import_block, 1)

          helper = '''function prepareRowsForDisplay(opportunities) {
            return opportunities.map((opportunity) => {
              const town = String(opportunity.town || "").trim();
              if (!town) return opportunity;

              const country = String(opportunity.country || "").trim().toUpperCase();
              const localizedTown = localizeNewCity(country, town, locale());
              if (!localizedTown || localizedTown === town) return opportunity;

              return { ...opportunity, town: localizedTown };
            });
          }

          '''

          anchor = 'function renderActive() {'
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit("ERROR: renderActive anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          text = text.replace(
              'dom.opportunitiesBody.innerHTML = renderRows(results, {',
              'dom.opportunitiesBody.innerHTML = renderRows(prepareRowsForDisplay(results), {',
              1,
          )

          text = text.replace(
              'dom.expiredBody.innerHTML = renderRows(results, {',
              'dom.expiredBody.innerHTML = renderRows(prepareRowsForDisplay(results), {',
              1,
          )

          path.write_text(text, encoding="utf-8")
          print("PASS: app.js now localizes town values only at render time")

      - name: Validate
        run: |
          node --check web/app.js
          node --check web/table.js
          node --check web/city-localizations.js
          git diff --check
          grep -F 'prepareRowsForDisplay(results)' web/app.js
          grep -F 'IT|CAGLIARI' web/city-localizations.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js web/city-localizations.js
          git commit -m "fix: localize city names at render time"
          git push origin HEAD:main
