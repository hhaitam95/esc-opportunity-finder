name: One Locality Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Apply strict locality formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("web/city-localizations.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '  "GE|MTSKHETA, TSEROVANI IDP SETTLEMENT": { fr: "Mtskheta / Tserovani", ar: "متسخيتا / تسيروفاني" },',
              '  "GE|MTSKHETA, TSEROVANI IDP SETTLEMENT": { fr: "Mtskheta", ar: "متسخيتا" },',
          )

          start = text.index('function extractDisplayParts(value) {')
          end = text.index('\nconst ARABIC_DIGRAPHS = [', start)

          new_block = r'''function extractDisplayParts(value) {
            let text = cleanLocationValue(value);
            if (!text) return [];

            if (looksLikeAddress(text)) return [text];

            const sentenceLike = /\b(?:the volunteer|volunteer will|will be living|will live|living in|based in|located in|work in|working in)\b/iu.test(text)
              || text.length > 70;

            if (sentenceLike) {
              const living = text.match(/\b(?:living in|will be living in|based in|located in)\s+(.+?)(?:\s+\([^)]*\))?(?:\s+and\s+(?:work|working)\s+in\s+[^.;]+)?[.;]?$/iu);
              const working = text.match(/\b(?:work|working)\s+in\s+([^.;]+)[.;]?$/iu);
              if (living?.[1]) text = living[1];
              else if (working?.[1]) text = working[1];
              else {
                const parenthetical = text.match(/\(([^)]+)\)/u);
                if (parenthetical?.[1]) text = parenthetical[1];
              }
            }

            text = cleanLocationValue(text);
            if (!text) return [];

            // Strip common administrative/detail suffixes and select the first real locality.
            text = text
              .replace(/\s+IDP\s+settlement$/iu, "")
              .replace(/\s+(?:internally displaced people|internally displaced persons)\s+settlement$/iu, "")
              .replace(/\s+(?:settlement|village|municipality|municipality area|parish|province|district|county|region)$/iu, "")
              .replace(/\s+\([^)]*\)$/u, "")
              .trim();

            // Postal code + locality.
            text = text.replace(/^\d{4,6}\s*[-–]\s*/u, "").trim();

            // Common country suffixes do not belong in the locality cell.
            text = text.replace(/,?\s+(?:Italia|Italy|France|Deutschland|Germany|España|Spain|Portugal|Poland|Polska|Czechia|Türkiye|Turkey|Bolivia|Senegal|Romania|Nederland|Netherlands|Armenia|Georgia)$/iu, "").trim();

            // Extract a primary locality from slash/semicolon lists.
            const separated = text.split(/\s*\/\s*|\s*;\s*/u).map(cleanLocationValue).filter(Boolean);
            if (separated.length > 1) return [separated[0]];

            // For comma-delimited EYP values, the first component is the locality in the
            // overwhelming majority of records; later components are districts, regions,
            // nearby towns, countries, or administrative details.
            const commaParts = text.split(/\s*,\s*/u).map(cleanLocationValue).filter(Boolean);
            if (commaParts.length > 1) return [commaParts[0]];

            // Normalize common "city number - neighborhood" patterns to the city.
            const cityNeighborhood = text.match(/^(.+?)\s+-\s+(?:\p{L}[\p{L}\s'-]*)(?:\s+\d+)?$/u);
            if (cityNeighborhood && /^(?:praha|prague)$/iu.test(cityNeighborhood[1].trim())) {
              return [cityNeighborhood[1].trim()];
            }

            return [text];
          }
          '''

          text = text[:start] + new_block.rstrip() + text[end:]

          # Add a tiny self-test beside the formatter.  The checks are evaluated in Node below.
          test_block = r'''
          '''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate formatter syntax and behavior
        run: |
          node --check web/city-localizations.js
          node --check web/table.js
          node --input-type=module <<'JS'
          import { localizeNewCity } from './web/city-localizations.js';

          const cases = [
            ['GE', 'Mtskheta, Tserovani IDP Settlement', 'fr', 'Mtskheta'],
            ['GE', 'Mtskheta, Tserovani IDP Settlement', 'ar', 'متسخيتا'],
            ['CZ', 'Náchod', 'fr', 'Náchod'],
            ['CZ', 'Náchod', 'ar', 'ناخود'],
            ['CZ', 'Praha 5 - Stodůlky', 'fr', 'Prague'],
            ['IT', 'Genova', 'fr', 'Gênes'],
            ['IT', 'Genova', 'ar', 'جنوة'],
            ['IT', 'CAGLIARI', 'ar', 'كالياري'],
            ['ES', 'The volunteer will be living in Jesús (a village close to Roquetes and Tortosa) and work in Roquetes.', 'fr', 'Jesús'],
            ['BO', 'La Paz, Bolivia', 'fr', 'La Paz'],
            ['PT', 'Braga, Sanguedo, Cucujães and Guimarães', 'fr', 'Braga'],
          ];

          for (const [country, input, locale, expected] of cases) {
            const actual = localizeNewCity(country, input, locale);
            if (actual !== expected) {
              throw new Error(`${country} ${input} (${locale}) => ${actual}; expected ${expected}`);
            }
          }

          console.log(`PASS: ${cases.length} locality formatting cases.`);
          JS

      - name: Commit final locality formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one_locality_fix.yml
          git add web/city-localizations.js
          git commit -m "fix: display one localized primary locality" \
            -m "Normalize EYP town values to one concise locality before French/Arabic localization." \
            || exit 0
          git push origin main
