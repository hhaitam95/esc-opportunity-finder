name: Extract city localization candidates

on:
  push:
    paths:
      - ".github/workflows/_extract_city_localization_candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract unique country and town pairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/opportunities.json").read_text(encoding="utf-8"))
          pairs = {}
          for item in data.get("opportunities", []):
              if not isinstance(item, dict):
                  continue
              country = str(item.get("country") or "").strip().upper()
              town = str(item.get("town") or "").strip()
              if country and town:
                  pairs[f"{country}|{town.upper()}"] = {"country": country, "town": town}
          output = Path("data/city-localization-candidates.json")
          output.write_text(
              json.dumps([pairs[k] for k in sorted(pairs)], ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Extracted {len(pairs)} unique country/town pairs")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/city-localization-candidates.json
          git commit -m "chore: extract current city localization candidates"
          git push origin HEAD:main
