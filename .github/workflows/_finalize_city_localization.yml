name: Finalize city localization

on:
  push:
    paths:
      - ".github/workflows/_finalize_city_localization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update table.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("web/table.js")
          text = path.read_text(encoding="utf-8")

          import_line = 'import { localizeNewCity } from "./city-localizations.js";\n'
          if not text.startswith(import_line):
              text = import_line + text

          pattern = re.compile(
              r"function formatCity\(opportunity, locale\) \{.*?\n\}\n\nfunction topicLabel",
              re.DOTALL,
          )
          replacement = '''function formatCity(opportunity, locale) {
            const town = String(opportunity.town || "").trim();
            const location = String(opportunity.location || "").trim();
            if (!town) return location;

            const country = String(opportunity.country || "").trim().toUpperCase();
            const key = `${country}|${town.toUpperCase()}`;
            const language = locale.startsWith("fr")
              ? "fr"
              : locale.startsWith("ar")
                ? "ar"
                : "en";

            if (CITY_TRANSLATIONS[key]?.[language]) {
              return CITY_TRANSLATIONS[key][language];
            }

            if (CITY_NAME_CORRECTIONS[key]) return CITY_NAME_CORRECTIONS[key];

            return localizeNewCity(country, town, locale);
          }

function topicLabel'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("ERROR: formatCity was not found")

          path.write_text(updated, encoding="utf-8")
          print("PASS: formatCity updated")
          PY

      - name: Validate
        run: |
          node --check web/table.js
          node --check web/city-localizations.js
          git diff --check
          grep -F 'return localizeNewCity(country, town, locale);' web/table.js
          grep -F '"IT|CAGLIARI"' web/city-localizations.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js web/city-localizations.js
          git commit -m "fix: use deterministic city localization with safe fallback"
          git push origin HEAD:main
