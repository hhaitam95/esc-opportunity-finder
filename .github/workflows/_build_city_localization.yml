name: Build complete city localization map

on:
  push:
    paths:
      - ".github/workflows/_build_city_localization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-city-localization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build localization map
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests

          data = json.loads(Path("data/opportunities.json").read_text(encoding="utf-8"))
          opportunities = data.get("opportunities", [])
          pairs = {}
          for item in opportunities:
              if not isinstance(item, dict):
                  continue
              country = str(item.get("country") or "").strip().upper()
              town = str(item.get("town") or item.get("city") or "").strip()
              if country and town:
                  pairs.setdefault(f"{country}|{town.upper()}", (country, town))
          print(f"Dataset opportunities: {len(opportunities)}")
          print(f"Unique city pairs: {len(pairs)}")

          API = "https://www.wikidata.org/w/api.php"
          headers = {"User-Agent": "ESC-Opportunity-Finder/1.0 city-localization-builder", "Accept": "application/json"}

          def search(pair):
              key, (country, town) = pair
              params = {"action":"wbsearchentities","search":f"{town} {country}","language":"en","uselang":"en","format":"json","limit":5,"type":"item"}
              for attempt in range(3):
                  try:
                      r = requests.get(API, params=params, headers=headers, timeout=20)
                      r.raise_for_status()
                      results = r.json().get("search", [])
                      norm = re.sub(r"\s+", " ", town).strip().casefold()
                      scored = []
                      for result in results:
                          label = str(result.get("label") or "")
                          desc = str(result.get("description") or "").casefold()
                          label_norm = re.sub(r"\s+", " ", label).strip().casefold()
                          score = 100 if label_norm == norm else 0
                          if norm in label_norm or label_norm in norm:
                              score += 25
                          if any(x in desc for x in ("city", "town", "municipality", "commune")):
                              score += 10
                          if country.casefold() in desc:
                              score += 20
                          scored.append((score, result.get("id")))
                      scored.sort(reverse=True)
                      return key, scored[0][1] if scored else None
                  except Exception as exc:
                      if attempt == 2:
                          print(f"WARN search {key}: {exc}")
                      time.sleep(2 * (attempt + 1))
              return key, None

          resolved = {}
          items = list(pairs.items())
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures = [pool.submit(search, item) for item in items]
              for i, future in enumerate(as_completed(futures), 1):
                  key, qid = future.result()
                  if qid:
                      resolved[key] = qid
                  if i % 50 == 0 or i == len(futures):
                      print(f"Resolved {i}/{len(futures)}")

          entities = {}
          ids = list(dict.fromkeys(resolved.values()))
          for start in range(0, len(ids), 50):
              batch = ids[start:start+50]
              params = {"action":"wbgetentities","ids":"|".join(batch),"props":"labels","languages":"en|fr|ar","format":"json"}
              for attempt in range(3):
                  try:
                      r = requests.get(API, params=params, headers=headers, timeout=30)
                      r.raise_for_status()
                      entities.update(r.json().get("entities", {}))
                      break
                  except Exception as exc:
                      if attempt == 2:
                          print(f"WARN entity batch: {exc}")
                      time.sleep(2 * (attempt + 1))

          def label(entity, lang):
              return str(entity.get("labels", {}).get(lang, {}).get("value") or "").strip()

          translations = {}
          for key, (country, town) in sorted(pairs.items()):
              entity = entities.get(resolved.get(key), {})
              translations[key] = {"fr": label(entity, "fr") or town, "ar": label(entity, "ar") or town}

          table = Path("web/table.js")
          text = table.read_text(encoding="utf-8")
          start_marker = "const CITY_TRANSLATIONS = {"
          end_marker = "\n};\n\nfunction titleCaseCity"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: CITY_TRANSLATIONS boundaries not found")

          lines = [start_marker]
          for key in sorted(translations):
              v = translations[key]
              lines.append(f"  {json.dumps(key, ensure_ascii=False)}: {{")
              lines.append(f"    fr: {json.dumps(v['fr'], ensure_ascii=False)},")
              lines.append(f"    ar: {json.dumps(v['ar'], ensure_ascii=False)},")
              lines.append("  },")
          lines.append("};")
          table.write_text(text[:start] + "\n".join(lines) + text[end+3:], encoding="utf-8")

          assert "IT|CAGLIARI" in translations
          assert translations["IT|CAGLIARI"]["ar"] == "كالياري", translations["IT|CAGLIARI"]
          print(f"PASS: generated {len(translations)} city mappings")
          print(f"PASS: IT|CAGLIARI -> {translations['IT|CAGLIARI']}")
          PY
      - name: Validate
        run: node --check web/table.js
      - name: Commit result and remove builder
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: localize all published opportunity cities"
          fi
          git rm .github/workflows/_build_city_localization.yml
          git commit -m "chore: remove temporary city localization builder"
          git push origin HEAD:main
