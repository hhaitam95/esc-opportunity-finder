name: ESC Opportunity Finder Health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health:
    name: Verify recent successful scraper run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check last successful update workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=20")"

          latest="$(printf '%s' "$response" | jq -r '
            [.workflow_runs[]
              | select(.status == "completed" and .conclusion == "success")
            ]
            | sort_by(.updated_at)
            | last
            | [.id, .updated_at, .html_url]
            | @tsv
          ')

          if [[ -z "$latest" || "$latest" == "null\tnull\tnull" ]]; then
            echo "ERROR: no successful Update ESC Opportunities workflow run was found."
            exit 1
          fi

          IFS=$'\t' read -r run_id updated_at run_url <<< "$latest"

          updated_epoch="$(date -u -d "$updated_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - updated_epoch))

          echo "Last successful update run: $run_id"
          echo "Completed at: $updated_at"
          echo "Run: $run_url"
          echo "Age: ${age_seconds}s"

          if (( age_seconds < 0 )); then
            echo "ERROR: last successful run is in the future."
            exit 1
          fi

          if (( age_seconds > 7200 )); then
            echo "ERROR: no successful scraper update in the last 2 hours."
            exit 1
          fi

          echo "PASS: scraper workflow is updating within the expected window."
