name: Location Cleanup Migration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/_location_cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Patch location localization helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("web/city-localizations.js")
          text = path.read_text(encoding="utf-8")

          marker = '  "GE|MTSKHETA, TSEROVANI IDP SETTLEMENT": { fr: "Mtskheta / Tserovani", ar: "متسخيتا / تسيروفاني" },\n'
          if marker not in text:
              text = text.replace('const CITY_LOCALIZATION_OVERRIDES = {\n', 'const CITY_LOCALIZATION_OVERRIDES = {\n' + marker, 1)

          start = text.index('function cleanLocationValue(value) {')
          end = text.index('\nfunction looksLikeAddress(value) {', start)
          new_clean = '''function cleanLocationValue(value) {
            let text = String(value || "")
              .replace(/[\\u200e\\u200f\\u202a-\\u202e]/g, "")
              .replace(/\\s+/g, " ")
              .trim();

            text = text.replace(/^\\d{4,6}\\s*[-–]\\s*/u, "");
            text = text.replace(/,?\\s+(?:Italia|Italy|France|Deutschland|Germany|España|Spain|Portugal|Poland|Polska|Czechia|Türkiye|Turkey|Bolivia|Senegal|Romania|Nederland|Netherlands)$/iu, "");
            text = text.replace(/\\s*\\(\\s*[A-Z]{2,5}\\s*\\)\\s*$/u, "");
            text = text.replace(/[.;,]+$/u, "").trim();

            // Remove generic descriptive labels from the feed while keeping the actual place name.
            text = text
              .replace(/\\s+(?:IDP|internally displaced people|internally displaced persons)\\s+settlement$/iu, "")
              .replace(/\\s+(?:settlement|village|municipality|municipality area|parish|province|district)$/iu, "")
              .replace(/\\s+municipality$/iu, "")
              .replace(/\\s+county$/iu, "")
              .replace(/\\s+region$/iu, "")
              .trim();

            return text;
          }
          '''
          text = text[:start] + new_clean.rstrip() + text[end:]

          marker2 = 'export function localizeNewCity(country, city, locale) {'
          s = text.index(marker2)
          e = text.index('\nexport function normalizedCityKey', s)
          new_fn = '''export function localizeNewCity(country, city, locale) {
            const language = languageFor(locale);
            const parts = extractDisplayParts(city).slice(0, 3);
            if (!parts.length) return "";

            const localized = parts.map((part) => {
              const cleanedPart = cleanLocationValue(part);
              if (!cleanedPart) return "";

              const key = normalizeCityKey(country, cleanedPart);
              const override = NORMALIZED_CITY_OVERRIDES[key];
              if (override?.[language]) return override[language];

              // Known local spellings/exonyms are handled by the curated map.
              if (language === "fr") return titleCaseLocation(cleanedPart);
              if (language === "en") return titleCaseLocation(cleanedPart);
              return arabicTransliteration(cleanedPart) || titleCaseLocation(cleanedPart);
            });

            return [...new Set(localized.filter(Boolean))].join(" / ");
          }
          '''
          text = text[:s] + new_fn.rstrip() + text[e:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check web/city-localizations.js

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/city-localizations.js .github/workflows/_location_cleanup.yml
          git commit -m "fix: format and localize compound location names" || exit 0
          git push origin main
