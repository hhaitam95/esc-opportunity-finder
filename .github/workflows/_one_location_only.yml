name: Apply One Location Only Fix

on:
  push:
    paths:
      - ".github/workflows/_one_location_only.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Apply simple locality logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # table.js: always pass either town or original location through the same formatter.
          path = Path("web/table.js")
          text = path.read_text(encoding="utf-8")
          old = '''function formatCity(opportunity, locale) {
            const town = String(opportunity.town || "").trim();
            if (!town) {
              return String(opportunity.location || "").trim();
            }

            const country = String(opportunity.country || "").trim().toUpperCase();
            return localizeNewCity(country, town, locale);
          }'''
          new = '''function formatCity(opportunity, locale) {
            const value = String(opportunity.town || opportunity.location || "").trim();
            if (!value) return "";

            const country = String(opportunity.country || "").trim().toUpperCase();
            return localizeNewCity(country, value, locale);
          }'''
          if old not in text:
              raise SystemExit("formatCity block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # city-localizations.js: resolve ONE locality, then localize that single value.
          path = Path("web/city-localizations.js")
          text = path.read_text(encoding="utf-8")

          old_comma = '''  if (parts.length === 1 && /,/.test(text)) {
    const commaParts = text.split(/\s*,\s*/u).map(cleanLocationValue).filter(Boolean);
    if (commaParts.length > 1 && (text.length > 35 || /\b(?:region|municipality|village|province)\b/iu.test(text))) return commaParts;
  }

  return parts.length ? parts : [text];'''
          new_comma = '''  if (parts.length === 1 && /,/.test(text)) {
    const commaParts = text.split(/\s*,\s*/u).map(cleanLocationValue).filter(Boolean);
    if (commaParts.length > 1) return [commaParts[0]];
  }

  return parts.length ? [parts[0]] : [text];'''
          if old_comma not in text:
              raise SystemExit("comma extraction block not found")
          text = text.replace(old_comma, new_comma, 1)

          old_slice = '  const parts = extractDisplayParts(city).slice(0, 3);'
          new_slice = '  const parts = extractDisplayParts(city).slice(0, 1);'
          if old_slice not in text:
              raise SystemExit("locality slice not found")
          text = text.replace(old_slice, new_slice, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate JavaScript and exact examples
        run: |
          node --check web/city-localizations.js
          node --check web/table.js
          node --input-type=module <<'JS'
          import { localizeNewCity } from './web/city-localizations.js';

          const tests = [
            ['GE', 'Mtskheta, Tserovani IDP Settlement', 'fr', 'Mtskheta'],
            ['GE', 'Mtskheta, Tserovani IDP Settlement', 'ar', 'متسخيتا'],
            ['CZ', 'Praha 5 - Stodůlky', 'fr', 'Prague'],
            ['IT', 'Genova', 'fr', 'Gênes'],
            ['IT', 'Genova', 'ar', 'جنوة'],
            ['IT', 'CAGLIARI', 'ar', 'كالياري'],
            ['BO', 'La Paz, Bolivia', 'fr', 'La Paz'],
            ['PT', 'Braga, Sanguedo, Cucujães and Guimarães', 'fr', 'Braga'],
          ];

          for (const [country, input, locale, expected] of tests) {
            const actual = localizeNewCity(country, input, locale);
            if (actual !== expected) {
              throw new Error(`${country}: ${input} (${locale}) => ${actual}; expected ${expected}`);
            }
          }
          console.log(`PASS: ${tests.length} one-locality examples.`);
          JS

      - name: Commit and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js web/city-localizations.js
          git rm .github/workflows/_one_location_only.yml
          git commit -m "fix: extract and localize one primary location" || exit 0
          git push origin main
