name: Build complete city localization map (batched)

on:
  push:
    paths:
      - ".github/workflows/_build_city_localization_fast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-city-localization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build localization map
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          import requests

          DATA_PATH = Path("data/opportunities.json")
          TABLE_PATH = Path("web/table.js")
          SPARQL = "https://query.wikidata.org/sparql"
          HEADERS = {
              "User-Agent": "ESC-Opportunity-Finder/1.0 city-localization-builder",
              "Accept": "application/sparql-results+json",
          }

          payload = json.loads(DATA_PATH.read_text(encoding="utf-8"))
          opportunities = payload.get("opportunities", [])
          if not isinstance(opportunities, list) or not opportunities:
              raise SystemExit("ERROR: published opportunity dataset is empty.")

          pairs = {}
          for item in opportunities:
              if not isinstance(item, dict):
                  continue
              country = str(item.get("country") or "").strip().upper()
              town = str(item.get("town") or item.get("city") or "").strip()
              if country and town:
                  pairs.setdefault((country, town.upper()), town)

          print(f"Dataset opportunities: {len(opportunities)}")
          print(f"Unique country/city pairs: {len(pairs)}")

          def esc(value):
              return value.replace("\\", "\\\\").replace('"', '\\"')

          items = list(pairs.items())
          translations = {}

          for offset in range(0, len(items), 40):
              batch = items[offset:offset + 40]
              values = "\n".join(
                  f'    ("{esc(town)}" "{country}")'
                  for (country, _), town in batch
              )
              query = f"""
          PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX wdt: <http://www.wikidata.org/prop/direct/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX skos: <http://www.w3.org/2004/02/skos/core#>

          SELECT ?name ?countryCode ?item ?frLabel ?arLabel WHERE {{
            VALUES (?name ?countryCode) {{
          {values}
            }}
            ?country wdt:P297 ?countryCode.
            ?item wdt:P17 ?country.
            ?item wdt:P31/wdt:P279* wd:Q486972.
            {{ ?item rdfs:label ?label. }} UNION {{ ?item skos:altLabel ?label. }}
            FILTER(LCASE(STR(?label)) = LCASE(?name))
            OPTIONAL {{ ?item rdfs:label ?frLabel. FILTER(LANG(?frLabel) = "fr") }}
            OPTIONAL {{ ?item rdfs:label ?arLabel. FILTER(LANG(?arLabel) = "ar") }}
          }}
          """
              for attempt in range(1, 4):
                  try:
                      response = requests.get(
                          SPARQL,
                          params={"query": query, "format": "json"},
                          headers=HEADERS,
                          timeout=90,
                      )
                      response.raise_for_status()
                      rows = response.json().get("results", {}).get("bindings", [])
                      for row in rows:
                          key = (
                              row["countryCode"]["value"].upper(),
                              row["name"]["value"].upper(),
                          )
                          current = translations.get(key)
                          candidate = {
                              "fr": row.get("frLabel", {}).get("value") or pairs.get(key, row["name"]["value"]),
                              "ar": row.get("arLabel", {}).get("value") or pairs.get(key, row["name"]["value"]),
                          }
                          if current is None:
                              translations[key] = candidate
                          else:
                              if current["fr"] == pairs.get(key, "") and candidate["fr"] != pairs.get(key, ""):
                                  current["fr"] = candidate["fr"]
                              if current["ar"] == pairs.get(key, "") and candidate["ar"] != pairs.get(key, ""):
                                  current["ar"] = candidate["ar"]
                      print(f"SPARQL batch {offset + len(batch)}/{len(items)}: {len(rows)} matches")
                      break
                  except Exception as exc:
                      if attempt == 3:
                          print(f"WARN: SPARQL batch failed ({offset}): {exc}")
                      else:
                          time.sleep(attempt * 3)

          for key, town in pairs.items():
              translations.setdefault(key, {"fr": town, "ar": town})

          table = TABLE_PATH.read_text(encoding="utf-8")
          start_marker = "const CITY_TRANSLATIONS = {"
          end_marker = "\n};\n\nfunction titleCaseCity"
          start = table.find(start_marker)
          end = table.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: CITY_TRANSLATIONS boundaries not found.")

          lines = [start_marker]
          for (country, city_key), values in sorted(translations.items()):
              key = f"{country}|{city_key}"
              lines.append(f"  {json.dumps(key, ensure_ascii=False)}: {{")
              lines.append(f"    fr: {json.dumps(values['fr'], ensure_ascii=False)},")
              lines.append(f"    ar: {json.dumps(values['ar'], ensure_ascii=False)},")
              lines.append("  },")
          lines.append("};")

          updated = table[:start] + "\n".join(lines) + table[end + 3:]
          TABLE_PATH.write_text(updated, encoding="utf-8")

          assert "IT|CAGLIARI" in translations
          assert translations["IT|CAGLIARI"]["ar"] == "كالياري", translations["IT|CAGLIARI"]
          print(f"PASS: generated {len(translations)} dataset city mappings.")
          print(f"PASS: IT|CAGLIARI -> {translations['IT|CAGLIARI']}")
          PY
      - name: Validate frontend JavaScript
        run: node --check web/table.js
      - name: Commit result and remove temporary builders
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: localize all published opportunity cities"
          fi
          git rm .github/workflows/_build_city_localization_fast.yml
          git rm .github/workflows/_build_city_localization.yml || true
          git commit -m "chore: remove temporary city localization builders"
          git push origin HEAD:main
