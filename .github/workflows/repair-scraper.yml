name: One-time scraper repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore scraper from known-good commit
        run: |
          set -euo pipefail
          git checkout 0ceae79ab7f921274cfddeedbc76e1f345c9272d -- scraper/scraper.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scraper/scraper.py')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^API_PAGE_SIZE\s*=\s*\d+\s*$', 'API_PAGE_SIZE = 1000', text, count=1)
          if count != 1:
              raise SystemExit('ERROR: could not set API_PAGE_SIZE exactly once.')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scraper/scraper.py
          grep -n '^API_PAGE_SIZE' scraper/scraper.py
          grep -n '^BATCH_SIZE' scraper/scraper.py

      - name: Remove temporary recovery files
        run: |
          rm -f README.tmp README.tmp2 README.tmp3 README.tmp4 README.tmp5 README.tmp6 README.tmp7 README.tmp8
          git rm -f .github/workflows/repair-scraper.yml

      - name: Commit repaired scraper and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/scraper.py
          git add -u README.tmp README.tmp2 README.tmp3 README.tmp4 README.tmp5 README.tmp6 README.tmp7 README.tmp8 || true
          git diff --cached --check
          git commit -m "fix: restore scraper and safe API pagination"
          git push origin HEAD:main
