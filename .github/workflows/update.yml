# Canonical ESC opportunity update workflow.
# Keep this filename unchanged: .github/workflows/update.yml
name: Update ESC Opportunities

on:
  schedule:
    - cron: "0,30 * * * *"
  push:
    paths:
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: esc-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape and save ESC opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycountry requests beautifulsoup4

      - name: Apply permanent API pagination fix
        run: |
          python .github/scripts/bootstrap_pagination.py
          python -m py_compile scraper/scraper.py
          echo "PASS: scraper pagination source compiles."

      - name: Download and validate footer logos
        run: |
          set -euo pipefail
          mkdir -p web/assets
          curl --fail --location --silent --show-error --retry 3 \
            -A "Mozilla/5.0" \
            "https://youth.europa.eu/sites/default/files/eu-initiatives/logos/european-solidarity-corps.png" \
            -o web/assets/european-solidarity-corps.png
          test -s web/assets/european-solidarity-corps.png
          test -s web/assets/EYP-Logo.png
          file web/assets/european-solidarity-corps.png | grep -Eq 'PNG image data'
          file web/assets/EYP-Logo.png | grep -Eq 'PNG image data'
          echo "PASS: footer assets validated."

      - name: Run ESC scraper
        run: python scraper/run.py

      - name: Prune recently expired opportunities
        run: python scraper/prune_expired.py

      - name: Refresh published dataset timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          path = Path("data/opportunities.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          generated_at = datetime.now().isoformat()
          data["generated_at"] = generated_at
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"PASS: refreshed generated_at: {generated_at}")
          PY

      - name: Validate published dataset
        run: python scraper/validate_published.py

      - name: Validate Python sources
        run: |
          python -m py_compile scraper/run.py scraper/scraper.py scraper/prune_expired.py scraper/validate_published.py
          echo "PASS: scraper Python sources compile successfully."

      - name: Validate web JavaScript syntax
        run: |
          find web -maxdepth 2 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          echo "PASS: web JavaScript sources pass syntax validation."

      - name: Validate saved data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")
          if not opportunities_path.exists():
              raise SystemExit("ERROR: data/opportunities.json was not created.")
          if not expired_path.exists():
              raise SystemExit("ERROR: data/expired.json was not created.")

          opportunities = json.loads(opportunities_path.read_text(encoding="utf-8"))
          expired = json.loads(expired_path.read_text(encoding="utf-8"))
          if not isinstance(opportunities, dict):
              raise SystemExit("ERROR: opportunities data must be an object.")
          if not isinstance(expired, dict):
              raise SystemExit("ERROR: expired data must be an object.")
          if not isinstance(opportunities.get("opportunities"), list) or not opportunities["opportunities"]:
              raise SystemExit("ERROR: scraper produced an empty opportunities list.")
          if not isinstance(expired.get("opportunities"), list):
              raise SystemExit("ERROR: expired data has no opportunities list.")

          print(f"PASS: saved {len(opportunities['opportunities'])} current opportunities.")
          print(f"PASS: saved {len(expired['opportunities'])} recently expired opportunities.")
          print("PASS: canonical JSON data is valid.")
          PY

      - name: Commit updated data, source fix, and helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/opportunities.json data/expired.json data/checkpoint.json scraper/scraper.py .github/scripts/bootstrap_pagination.py web/assets/european-solidarity-corps.png

          if git diff --cached --quiet; then
            echo "No data/source/asset changes detected."
            exit 0
          fi

          git diff --cached --check
          git commit -m "chore: update ESC opportunities"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "ESC data/source/assets updated and pushed."
          echo "The push to main triggers deploy.yml."