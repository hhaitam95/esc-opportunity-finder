name: Update ESC Opportunities

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esc-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape and save ESC opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycountry requests beautifulsoup4

      - name: Validate Python sources
        run: |
          python -m py_compile scraper/run.py scraper/scraper.py scraper/prune_expired.py scraper/validate_published.py
          echo "PASS: scraper Python sources compile successfully."

      - name: Verify scraper dependencies
        run: |
          python - <<'PY'
          import pycountry
          import requests
          from bs4 import BeautifulSoup

          print(f"PASS: pycountry {getattr(pycountry, '__version__', 'installed')}")
          print(f"PASS: requests {requests.__version__}")
          print(f"PASS: beautifulsoup4 import available ({BeautifulSoup.__name__})")
          PY

      - name: Run ESC scraper
        run: |
          python scraper/run.py

      - name: Prune recently expired opportunities
        run: |
          python scraper/prune_expired.py

      - name: Validate published dataset
        run: |
          python scraper/validate_published.py

      - name: Validate web JavaScript syntax
        run: |
          find web -maxdepth 2 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          echo "PASS: web JavaScript sources pass syntax validation."

      - name: Validate saved data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")

          if not opportunities_path.exists():
              raise SystemExit("ERROR: data/opportunities.json was not created.")
          if not expired_path.exists():
              raise SystemExit("ERROR: data/expired.json was not created.")

          opportunities = json.loads(opportunities_path.read_text(encoding="utf-8"))
          expired = json.loads(expired_path.read_text(encoding="utf-8"))

          if not isinstance(opportunities, dict):
              raise SystemExit("ERROR: data/opportunities.json must contain an object.")
          if not isinstance(expired, dict):
              raise SystemExit("ERROR: data/expired.json must contain an object.")
          if not isinstance(opportunities.get("opportunities"), list) or not opportunities["opportunities"]:
              raise SystemExit("ERROR: scraper produced an empty opportunities list.")
          if not isinstance(expired.get("opportunities"), list):
              raise SystemExit("ERROR: data/expired.json has no opportunities list.")

          print(f"PASS: saved {len(opportunities['opportunities'])} current opportunities.")
          print(f"PASS: saved {len(expired['opportunities'])} recently expired opportunities.")
          print("PASS: canonical JSON data is valid.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/opportunities.json
          git add -- data/expired.json
          git add -- data/checkpoint.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git diff --cached --check

          git commit -m "chore: update ESC opportunities"
          git push origin main

          echo "ESC data updated and pushed."
          echo "The push to main triggers deploy.yml."
