name: Update ESC Opportunities

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: esc-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape and save ESC opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycountry requests beautifulsoup4

      - name: Download and validate footer logos
        run: |
          set -euo pipefail
          mkdir -p web/assets

          # The ESC asset is refreshed from the official European Youth Portal.
          curl --fail --location --silent --show-error --retry 3 \
            -A "Mozilla/5.0" \
            "https://youth.europa.eu/sites/default/files/eu-initiatives/logos/european-solidarity-corps.png" \
            -o web/assets/european-solidarity-corps.png

          # The EYP asset is kept in the repository because Eurodesk blocks
          # unattended GitHub Actions downloads with HTTP 403.
          test -s web/assets/european-solidarity-corps.png
          test -s web/assets/EYP-Logo.png

          file web/assets/european-solidarity-corps.png | grep -Eq 'PNG image data'
          file web/assets/EYP-Logo.png | grep -Eq 'PNG image data'

          echo "PASS: ESC logo downloaded and EYP logo repository asset validated."

      - name: Apply permanent API pagination fix once
        run: |
          python - <<'PY'
          from pathlib import Path

          scraper_path = Path("scraper/scraper.py")
          workflow_path = Path(".github/workflows/update.yml")

          scraper = scraper_path.read_text(encoding="utf-8")

          if "# API_PAGINATION_DEDUP_V2" not in scraper:
              old = '''    opportunities = []

    offset = 0
    total = None

    try:
        while True:
            data = fetch_api_page(
                session,
                offset,
            )

            if data is None:
                raise RuntimeError(
                    "Could not retrieve the current "
                    "opportunity list."
                )

            hits = data.get(
                "hits",
                {},
            )

            total_info = hits.get(
                "total",
                {},
            )

            if total is None:
                if isinstance(
                    total_info,
                    dict,
                ):
                    total = int(
                        total_info.get(
                            "value",
                            0,
                        )
                        or 0
                    )
                else:
                    total = int(
                        total_info or 0
                    )

                print(
                    f"API reports {total} opportunities.",
                    flush=True,
                )

            page_hits = hits.get(
                "hits",
                [],
            )

            if not page_hits:
                break

            for hit in page_hits:
                source = hit.get(
                    "_source",
                    {},
                )

                opid = source.get(
                    "opid"
                )

                if opid is None:
                    opid = hit.get(
                        "_id"
                    )

                if opid is None:
                    continue

                try:
                    source["opid"] = int(opid)
                except (
                    TypeError,
                    ValueError,
                ):
                    continue

                opportunities.append(
                    source
                )

            offset += len(page_hits)

            print(
                f"Retrieved "
                f"{len(opportunities)}/{total}",
                flush=True,
            )

            if (
                total is not None
                and offset >= total
            ):
                break

    finally:
        session.close()

    if (
        total is not None
        and len(opportunities) != total
    ):
        raise RuntimeError(
            "Incomplete API retrieval: "
            f"{len(opportunities)}/{total}"
        )

    return opportunities
'''

              new = '''    # API_PAGINATION_DEDUP_V2
    opportunities_by_id = {}

    offset = 0
    total = None

    try:
        while True:
            data = fetch_api_page(
                session,
                offset,
            )

            if data is None:
                raise RuntimeError(
                    "Could not retrieve the current "
                    "opportunity list."
                )

            hits = data.get(
                "hits",
                {},
            )

            total_info = hits.get(
                "total",
                {},
            )

            if total is None:
                if isinstance(
                    total_info,
                    dict,
                ):
                    total = int(
                        total_info.get(
                            "value",
                            0,
                        )
                        or 0
                    )
                else:
                    total = int(
                        total_info or 0
                    )

                print(
                    f"API reports {total} opportunities.",
                    flush=True,
                )

            page_hits = hits.get(
                "hits",
                [],
            )

            if not page_hits:
                break

            for hit in page_hits:
                source = hit.get(
                    "_source",
                    {},
                )

                opid = source.get(
                    "opid"
                )

                if opid is None:
                    opid = hit.get(
                        "_id"
                    )

                if opid is None:
                    continue

                try:
                    source["opid"] = int(opid)
                except (
                    TypeError,
                    ValueError,
                ):
                    continue

                opid_key = str(source["opid"])
                opportunities_by_id.setdefault(
                    opid_key,
                    source,
                )

            offset += len(page_hits)
            unique_count = len(opportunities_by_id)

            print(
                f"Retrieved "
                f"{unique_count}/{total} unique opportunities "
                f"(raw page hits: {len(page_hits)})",
                flush=True,
            )

            if (
                total is not None
                and unique_count >= total
            ):
                break

    finally:
        session.close()

    opportunities = list(
        opportunities_by_id.values()
    )

    if (
        total is not None
        and len(opportunities) != total
    ):
        raise RuntimeError(
            "Incomplete API retrieval: "
            f"{len(opportunities)}/{total} unique opportunities"
        )

    return opportunities
'''

              if old not in scraper:
                  raise SystemExit(
                      "ERROR: expected original API pagination block was not found; no source or workflow cleanup performed."
                  )

              scraper_path.write_text(
                  scraper.replace(old, new, 1),
                  encoding="utf-8",
              )
              print("PASS: permanent API pagination/deduplication fix applied to scraper.py.")
          else:
              print("PASS: permanent API pagination/deduplication fix already present.")

          # Remove this one-time repair step from the workflow itself.
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = '      - name: Apply permanent API pagination fix once\n'

          if marker not in workflow:
              print("PASS: one-time repair step already removed from update.yml.")
          else:
              start = workflow.index(marker)
              next_step = workflow.find('      - name: ', start + len(marker))
              if next_step == -1:
                  raise SystemExit(
                      "ERROR: could not find the next workflow step while removing the one-time repair step."
                  )

              workflow = workflow[:start] + workflow[next_step:]
              workflow_path.write_text(
                  workflow,
                  encoding="utf-8",
              )
              print("PASS: one-time repair step removed from update.yml for future runs.")
          PY

          python -m py_compile scraper/scraper.py
          python -m py_compile scraper/run.py
          echo "PASS: scraper sources compile after permanent pagination fix."

      - name: Install/verify scraper dependencies
        run: |
          python - <<'PY'
          import pycountry
          import requests
          from bs4 import BeautifulSoup

          print(f"PASS: pycountry {getattr(pycountry, '__version__', 'installed')}")
          print(f"PASS: requests {requests.__version__}")
          print(f"PASS: beautifulsoup4 import available ({BeautifulSoup.__name__})")
          PY

      - name: Run ESC scraper
        run: |
          python scraper/run.py

      - name: Prune recently expired opportunities
        run: |
          python scraper/prune_expired.py

      - name: Validate published dataset
        run: |
          python scraper/validate_published.py

      - name: Validate web JavaScript syntax
        run: |
          find web -maxdepth 2 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          echo "PASS: web JavaScript sources pass syntax validation."

      - name: Validate saved data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")

          if not opportunities_path.exists():
              raise SystemExit("ERROR: data/opportunities.json was not created.")
          if not expired_path.exists():
              raise SystemExit("ERROR: data/expired.json was not created.")

          opportunities = json.loads(opportunities_path.read_text(encoding="utf-8"))
          expired = json.loads(expired_path.read_text(encoding="utf-8"))

          if not isinstance(opportunities, dict):
              raise SystemExit("ERROR: data/opportunities.json must contain an object.")
          if not isinstance(expired, dict):
              raise SystemExit("ERROR: data/expired.json must contain an object.")
          if not isinstance(opportunities.get("opportunities"), list) or not opportunities["opportunities"]:
              raise SystemExit("ERROR: scraper produced an empty opportunities list.")
          if not isinstance(expired.get("opportunities"), list):
              raise SystemExit("ERROR: data/expired.json has no opportunities list.")

          print(f"PASS: saved {len(opportunities['opportunities'])} current opportunities.")
          print(f"PASS: saved {len(expired['opportunities'])} recently expired opportunities.")
          print("PASS: canonical JSON data is valid.")
          PY

      - name: Commit updated data and permanent source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/opportunities.json
          git add -- data/expired.json
          git add -- data/checkpoint.json
          git add -- scraper/scraper.py
          git add -- .github/workflows/update.yml
          git add -- web/assets/european-solidarity-corps.png

          if git diff --cached --quiet; then
            echo "No data/source/workflow changes detected."
            exit 0
          fi

          git diff --cached --check

          git commit -m "chore: update ESC opportunities"
          git push origin main

          echo "ESC data/source/workflow updated and pushed."
          echo "The push to main triggers deploy.yml."
