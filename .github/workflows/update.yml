name: Update ESC Opportunities

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    paths:
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: esc-opportunity-update
  cancel-in-progress: false

jobs:
  update:
    name: Scrape and save ESC opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycountry requests beautifulsoup4

      - name: Download and validate footer logos
        run: |
          set -euo pipefail
          mkdir -p web/assets
          curl --fail --location --silent --show-error --retry 3 \
            -A "Mozilla/5.0" \
            "https://youth.europa.eu/sites/default/files/eu-initiatives/logos/european-solidarity-corps.png" \
            -o web/assets/european-solidarity-corps.png
          test -s web/assets/european-solidarity-corps.png
          test -s web/assets/EYP-Logo.png
          file web/assets/european-solidarity-corps.png | grep -Eq 'PNG image data'
          file web/assets/EYP-Logo.png | grep -Eq 'PNG image data'
          echo "PASS: footer assets validated."

      - name: Bootstrap permanent API pagination fix
        run: |
          python - <<'PY'
          from pathlib import Path

          scraper_path = Path("scraper/scraper.py")
          workflow_path = Path(".github/workflows/update.yml")
          text = scraper_path.read_text(encoding="utf-8")

          marker = "# API_PAGINATION_DEDUP_V2"
          if marker not in text:
              start = text.find("def fetch_current_opportunities():")
              end = text.find("\n\n# ============================================================================\n# DETAIL PAGE PARSING", start)
              if start < 0 or end < 0:
                  raise SystemExit("ERROR: could not locate fetch_current_opportunities boundaries; no source change made.")

              new_function = '''def fetch_current_opportunities():
    print("=" * 70)
    print("FETCHING CURRENT ESC OPPORTUNITIES")
    print("=" * 70)

    session = requests.Session()
    opportunities_by_id = {}
    offset = 0
    total = None

    try:
        while True:
            data = fetch_api_page(session, offset)

            if data is None:
                raise RuntimeError(
                    "Could not retrieve the current opportunity list."
                )

            hits = data.get("hits", {})
            total_info = hits.get("total", {})

            if total is None:
                if isinstance(total_info, dict):
                    total = int(total_info.get("value", 0) or 0)
                else:
                    total = int(total_info or 0)

                print(
                    f"API reports {total} opportunities.",
                    flush=True,
                )

            page_hits = hits.get("hits", [])
            if not page_hits:
                break

            for hit in page_hits:
                source = hit.get("_source", {})
                opid = source.get("opid")
                if opid is None:
                    opid = hit.get("_id")
                if opid is None:
                    continue

                try:
                    source["opid"] = int(opid)
                except (TypeError, ValueError):
                    continue

                opportunities_by_id.setdefault(
                    str(source["opid"]),
                    source,
                )

            offset += len(page_hits)
            unique_count = len(opportunities_by_id)

            print(
                f"Retrieved {unique_count}/{total} unique opportunities "
                f"(raw page hits: {len(page_hits)})",
                flush=True,
            )

            if total is not None and unique_count >= total:
                break

    finally:
        session.close()

    opportunities = list(opportunities_by_id.values())

    if total is not None and len(opportunities) != total:
        raise RuntimeError(
            "Incomplete API retrieval: "
            f"{len(opportunities)}/{total} unique opportunities"
        )

    return opportunities
'''

              text = text[:start] + new_function + text[end:]
              scraper_path.write_text(text, encoding="utf-8")
              print("PASS: permanent API pagination/deduplication fix applied by function boundaries.")
          else:
              print("PASS: permanent API pagination/deduplication fix already present.")

          workflow = workflow_path.read_text(encoding="utf-8")
          step_marker = "      - name: Bootstrap permanent API pagination fix\n"
          if step_marker in workflow:
              start = workflow.index(step_marker)
              next_step = workflow.find("      - name: ", start + len(step_marker))
              if next_step < 0:
                  raise SystemExit("ERROR: could not locate next workflow step while removing bootstrap.")
              workflow = workflow[:start] + workflow[next_step:]
              workflow_path.write_text(workflow, encoding="utf-8")
              print("PASS: bootstrap step removed from update.yml.")
          else:
              print("PASS: bootstrap step already absent from update.yml.")
          PY

          python -m py_compile scraper/scraper.py
          echo "PASS: scraper pagination source compiles."

      - name: Run ESC scraper
        run: python scraper/run.py

      - name: Prune recently expired opportunities
        run: python scraper/prune_expired.py

      - name: Validate published dataset
        run: python scraper/validate_published.py

      - name: Validate Python sources
        run: |
          python -m py_compile scraper/run.py scraper/scraper.py scraper/prune_expired.py scraper/validate_published.py
          echo "PASS: scraper Python sources compile successfully."

      - name: Validate web JavaScript syntax
        run: |
          find web -maxdepth 2 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          echo "PASS: web JavaScript sources pass syntax validation."

      - name: Validate saved data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          opportunities_path = Path("data/opportunities.json")
          expired_path = Path("data/expired.json")
          if not opportunities_path.exists(): raise SystemExit("ERROR: data/opportunities.json was not created.")
          if not expired_path.exists(): raise SystemExit("ERROR: data/expired.json was not created.")

          opportunities = json.loads(opportunities_path.read_text(encoding="utf-8"))
          expired = json.loads(expired_path.read_text(encoding="utf-8"))
          if not isinstance(opportunities, dict): raise SystemExit("ERROR: opportunities data must be an object.")
          if not isinstance(expired, dict): raise SystemExit("ERROR: expired data must be an object.")
          if not isinstance(opportunities.get("opportunities"), list) or not opportunities["opportunities"]:
              raise SystemExit("ERROR: scraper produced an empty opportunities list.")
          if not isinstance(expired.get("opportunities"), list):
              raise SystemExit("ERROR: expired data has no opportunities list.")

          print(f"PASS: saved {len(opportunities['opportunities'])} current opportunities.")
          print(f"PASS: saved {len(expired['opportunities'])} recently expired opportunities.")
          print("PASS: canonical JSON data is valid.")
          PY

      - name: Commit updated data, source fix, and workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/opportunities.json data/expired.json data/checkpoint.json scraper/scraper.py .github/workflows/update.yml web/assets/european-solidarity-corps.png

          if git diff --cached --quiet; then
            echo "No data/source/workflow/asset changes detected."
            exit 0
          fi

          git diff --cached --check
          git commit -m "chore: update ESC opportunities"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "ESC data/source/workflow/assets updated and pushed."
          echo "The push to main triggers deploy.yml."
