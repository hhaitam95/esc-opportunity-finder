name: Build complete city localization map (final)

on:
  push:
    paths:
      - ".github/workflows/_build_city_localization_final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-city-localization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build localization map
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests

          data = json.loads(Path("data/opportunities.json").read_text(encoding="utf-8"))
          opportunities = data.get("opportunities", [])
          pairs = {}
          for item in opportunities:
              if not isinstance(item, dict):
                  continue
              country = str(item.get("country") or "").strip().upper()
              town = str(item.get("town") or item.get("city") or "").strip()
              if country and town:
                  pairs.setdefault((country, town.upper()), town)

          print(f"Dataset opportunities: {len(opportunities)}")
          print(f"Unique country/city pairs: {len(pairs)}")

          API = "https://www.wikidata.org/w/api.php"
          HEADERS = {
              "User-Agent": "ESC-Opportunity-Finder/1.0 city-localization-builder",
              "Accept": "application/json",
          }

          def normalize(value):
              value = re.sub(r"[\u200e\u200f\u202a-\u202e]", "", str(value or ""))
              return re.sub(r"\s+", " ", value).strip().casefold()

          session = requests.Session()
          session.headers.update(HEADERS)

          def search(pair):
              (country, city_key), town = pair
              for query_text in (f"{town}, {country}", town):
                  for attempt in range(1, 4):
                      try:
                          response = session.get(
                              API,
                              params={
                                  "action": "wbsearchentities",
                                  "search": query_text,
                                  "language": "en",
                                  "uselang": "en",
                                  "format": "json",
                                  "limit": 10,
                                  "type": "item",
                              },
                              timeout=15,
                          )
                          response.raise_for_status()
                          results = response.json().get("search", [])
                          wanted = normalize(town)
                          scored = []
                          for result in results:
                              label = normalize(result.get("label"))
                              desc = normalize(result.get("description"))
                              score = 0
                              if label == wanted:
                                  score += 100
                              elif wanted in label or label in wanted:
                                  score += 40
                              if any(word in desc for word in ("city", "town", "municipality", "commune", "capital", "village")):
                                  score += 20
                              if country.casefold() in desc:
                                  score += 20
                              qid = result.get("id")
                              if qid:
                                  scored.append((score, qid))
                          if scored:
                              scored.sort(reverse=True)
                              return (country, city_key), scored[0][1]
                          break
                      except Exception:
                          if attempt < 3:
                              time.sleep(attempt)
              return (country, city_key), None

          resolved = {}
          items = list(pairs.items())
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(search, item) for item in items]
              for index, future in enumerate(as_completed(futures), 1):
                  pair, qid = future.result()
                  if qid:
                      resolved[pair] = qid
                  if index % 50 == 0 or index == len(futures):
                      print(f"Resolved {index}/{len(futures)}")

          entities = {}
          ids = list(dict.fromkeys(resolved.values()))
          for start in range(0, len(ids), 50):
              batch = ids[start:start + 50]
              for attempt in range(1, 4):
                  try:
                      response = session.get(
                          API,
                          params={
                              "action": "wbgetentities",
                              "ids": "|".join(batch),
                              "props": "labels|sitelinks",
                              "languages": "en|fr|ar",
                              "sitefilter": "frwiki|arwiki",
                              "format": "json",
                          },
                          timeout=30,
                      )
                      response.raise_for_status()
                      entities.update(response.json().get("entities", {}))
                      break
                  except Exception:
                      if attempt < 3:
                          time.sleep(attempt)

          def get_label(entity, language):
              return str(entity.get("labels", {}).get(language, {}).get("value") or "").strip()

          def get_sitelink(entity, site):
              return str(entity.get("sitelinks", {}).get(site, {}).get("title") or "").strip()

          translations = {}
          for pair, town in pairs.items():
              entity = entities.get(resolved.get(pair), {})
              fr = get_label(entity, "fr") or get_sitelink(entity, "frwiki") or town
              ar = get_label(entity, "ar") or get_sitelink(entity, "arwiki") or town
              translations[pair] = {"fr": fr, "ar": ar}

          print(f"PASS: resolved {len(resolved)}/{len(pairs)} city entities")
          print(f"PASS: French/Arabic mappings generated: {len(translations)}")
          cagliari = translations.get(("IT", "CAGLIARI"))
          if cagliari:
              print(f"PASS: Cagliari mapping: {cagliari}")
              assert cagliari["ar"] == "كالياري", cagliari

          table_path = Path("web/table.js")
          text = table_path.read_text(encoding="utf-8")
          start_marker = "const CITY_TRANSLATIONS = {"
          end_marker = "\n};\n\nfunction titleCaseCity"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: CITY_TRANSLATIONS boundaries not found")

          lines = [start_marker]
          for (country, city_key), values in sorted(translations.items()):
              key = f"{country}|{city_key}"
              lines.append(f"  {json.dumps(key, ensure_ascii=False)}: {{")
              lines.append(f"    fr: {json.dumps(values['fr'], ensure_ascii=False)},")
              lines.append(f"    ar: {json.dumps(values['ar'], ensure_ascii=False)},")
              lines.append("  },")
          lines.append("};")

          table_path.write_text(text[:start] + "\n".join(lines) + text[end + 3:], encoding="utf-8")
          PY
      - name: Validate frontend JavaScript
        run: node --check web/table.js
      - name: Commit result and remove temporary builders
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: localize all published opportunity cities"
          fi
          git rm .github/workflows/_build_city_localization_final.yml
          git rm .github/workflows/_build_city_localization_fast.yml || true
          git rm .github/workflows/_build_city_localization.yml || true
          git commit -m "chore: remove temporary city localization builders"
          git push origin HEAD:main