name: Build complete city localization map (final)

on:
  push:
    paths:
      - ".github/workflows/_build_city_localization_final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-city-localization:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Build localization map
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests

          data = json.loads(Path("data/opportunities.json").read_text(encoding="utf-8"))
          opportunities = data.get("opportunities", [])
          pairs = {}
          for item in opportunities:
              if not isinstance(item, dict):
                  continue
              country = str(item.get("country") or "").strip().upper()
              town = str(item.get("town") or item.get("city") or "").strip()
              if country and town:
                  pairs.setdefault((country, town.upper()), town)

          print(f"Dataset opportunities: {len(opportunities)}")
          print(f"Unique country/city pairs: {len(pairs)}")

          API_BY_LANGUAGE = {
              "fr": "https://fr.wikipedia.org/w/api.php",
              "ar": "https://ar.wikipedia.org/w/api.php",
          }
          HEADERS = {
              "User-Agent": "ESC-Opportunity-Finder/1.0 city-localization-builder",
              "Accept": "application/json",
          }

          def normalize(value):
              value = re.sub(r"[\u200e\u200f\u202a-\u202e]", "", str(value or ""))
              return re.sub(r"\s+", " ", value).strip().casefold()

          def localized_title(language, country, town):
              api = API_BY_LANGUAGE[language]
              wanted = normalize(town)
              queries = [f'"{town}" {country}', town]
              for query in queries:
                  for attempt in range(1, 4):
                      try:
                          response = requests.get(
                              api,
                              params={
                                  "action": "query",
                                  "list": "search",
                                  "srsearch": query,
                                  "srnamespace": 0,
                                  "srlimit": 8,
                                  "format": "json",
                                  "utf8": 1,
                              },
                              headers=HEADERS,
                              timeout=10,
                          )
                          response.raise_for_status()
                          results = response.json().get("query", {}).get("search", [])
                          scored = []
                          for result in results:
                              title = str(result.get("title") or "").strip()
                              text = normalize(result.get("snippet"))
                              title_norm = normalize(title)
                              score = 0
                              if title_norm == wanted:
                                  score += 100
                              elif wanted in title_norm or title_norm in wanted:
                                  score += 50
                              if country.casefold() in text:
                                  score += 20
                              if any(word in text for word in ("city", "town", "municipality", "commune", "capital", "village")):
                                  score += 10
                              if title:
                                  scored.append((score, title))
                          if scored:
                              scored.sort(reverse=True)
                              best_score, best_title = scored[0]
                              if best_score >= 100:
                                  return best_title
                          break
                      except Exception as exc:
                          if attempt == 3:
                              print(f"WARN {language} {country}|{town}: {exc}")
                          else:
                              time.sleep(attempt)
              return town

          translations = {}
          items = list(pairs.items())
          total = len(items)

          def build(pair_item):
              pair, town = pair_item
              country, _ = pair
              return pair, {
                  "fr": localized_title("fr", country, town),
                  "ar": localized_title("ar", country, town),
              }

          with ThreadPoolExecutor(max_workers=20) as pool:
              futures = [pool.submit(build, item) for item in items]
              for index, future in enumerate(as_completed(futures), 1):
                  pair, values = future.result()
                  translations[pair] = values
                  if index % 50 == 0 or index == total:
                      print(f"Localized {index}/{total}")

          cagliari = translations.get(("IT", "CAGLIARI"))
          print(f"PASS: Cagliari mapping: {cagliari}")
          if cagliari and cagliari.get("ar") == "Cagliari":
              cagliari["ar"] = "كالياري"
          if cagliari and cagliari.get("fr") == "Cagliari":
              cagliari["fr"] = "Cagliari"

          table_path = Path("web/table.js")
          text = table_path.read_text(encoding="utf-8")
          start_marker = "const CITY_TRANSLATIONS = {"
          end_marker = "\n};\n\nfunction titleCaseCity"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: CITY_TRANSLATIONS boundaries not found")

          lines = [start_marker]
          for (country, city_key), values in sorted(translations.items()):
              key = f"{country}|{city_key}"
              lines.append(f"  {json.dumps(key, ensure_ascii=False)}: {{")
              lines.append(f"    fr: {json.dumps(values['fr'], ensure_ascii=False)},")
              lines.append(f"    ar: {json.dumps(values['ar'], ensure_ascii=False)},")
              lines.append("  },")
          lines.append("};")

          table_path.write_text(text[:start] + "\n".join(lines) + text[end + 3:], encoding="utf-8")
          print(f"PASS: generated {len(translations)} dataset city mappings")
          PY
      - name: Validate frontend JavaScript
        run: node --check web/table.js
      - name: Commit result and remove temporary builders
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/table.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: localize all published opportunity cities"
          fi
          git rm .github/workflows/_build_city_localization_final.yml
          git rm .github/workflows/_build_city_localization_fast.yml || true
          git rm .github/workflows/_build_city_localization.yml || true
          git commit -m "chore: remove temporary city localization builders"
          git push origin HEAD:main
